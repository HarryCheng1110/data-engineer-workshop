[project]
name = "kafka-producer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6.0",
    "faker>=30.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kafka-producer = "kafka_producer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
